{% extends 'base_statistic.html' %}
{% load static %}

{% block title %}
    <title>Artistes par pays</title>
{% endblock %}

{% block content %}
        <div class="chart">
            <canvas id="bandByCountry" width="400px" height="400px"></canvas>
            <script>
            const ctx = document.getElementById('bandByCountry').getContext('2d');
            const myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels:  {{ countries|safe }},
                    datasets: [{
                        label: 'Artistes par pays',
                        data: {{bands_number}},
                        backgroundColor: [
                            '#FFA3DA',
                            '#C095E8',
                            '#AFBDFF',
                            '#95DBE8',
                            '#BDFFDB',
                            '#A8DDE3',
                            '#949DE3',
                        ],
                        borderColor: [
                            '#FF30C6',
                            '#812CE8',
                            '#3C6AFF',
                            '#2CD6E8',
                            '#4AFF8F',
                            '#4FD5E3',
                            '#4253E3',
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                     maintainAspectRatio: false,
                     indexAxis: 'y',
                }
            });
            </script>
        </div>
{% endblock %}
